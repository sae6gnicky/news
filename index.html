<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뉴스 역할극 방송 스튜디오</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; 
            overflow-x: hidden; 
            background-color: #0f172a; 
            user-select: none;
        }
        .text-shadow { text-shadow: 2px 2px 6px rgba(0,0,0,0.65); }
        .text-shadow-lg { text-shadow: 0 4px 12px rgba(0,0,0,0.85); }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            12% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-5px); }
        }
        .animate-reporter-badge {
            animation: fadeInOut 5s ease-in-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 에셋 URL (GitHub raw 주소로 변환하여 즉시 로드 보장) ---
        const ASSETS = {
            openingVideo: 'https://github.com/sae6gnicky/news/raw/main/opening.mp4',
            anchorBg: 'https://github.com/sae6gnicky/news/raw/main/abg.png',
            titleBar: 'https://github.com/sae6gnicky/news/raw/main/titlebar.png',
            weatherBg: 'https://github.com/sae6gnicky/news/raw/main/wbg.png',
            defaultReporterBg: 'https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=1280&q=80'
        };

        // 타이틀바의 하얀색 영역에 한 줄로 깔끔하게 들어가는 최적 글자 수 (공백 포함 25자)
        const MAX_HEADLINE_LENGTH = 25;

        // --- 아이콘 컴포넌트 ---
        const Icon = ({ children, size = 24, color = "currentColor", className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Video = (props) => <Icon {...props}><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></Icon>;
        const Plus = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></Icon>;
        const Play = (props) => <Icon {...props} fill={props.fill || "none"}><polygon points="5 3 19 12 5 21 5 3"></polygon></Icon>;
        const ChevronRight = (props) => <Icon {...props}><polyline points="9 18 15 12 9 6"></polyline></Icon>;
        const ChevronLeft = (props) => <Icon {...props}><polyline points="15 18 9 12 15 6"></polyline></Icon>;
        const ChevronUp = (props) => <Icon {...props}><polyline points="18 15 12 9 6 15"></polyline></Icon>;
        const ChevronDown = (props) => <Icon {...props}><polyline points="6 9 12 15 18 9"></polyline></Icon>;
        const Trash2 = (props) => <Icon {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></Icon>;
        const GripVertical = (props) => <Icon {...props}><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></Icon>;
        const Camera = (props) => <Icon {...props}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></Icon>;
        const CheckCircle = (props) => <Icon {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></Icon>;
        const Upload = (props) => <Icon {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></Icon>;
        const Tv = (props) => <Icon {...props}><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></Icon>;
        const Mic = (props) => <Icon {...props}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></Icon>;
        const Droplets = (props) => <Icon {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7 2.99 7 2.99s-2.29 6.08-2.29 6.08C3.57 10 3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 1 14 8c2 2.5 2 4.5 2 4.5"/></Icon>;
        const Wind = (props) => <Icon {...props}><path d="M12.8 19.6A2 2 0 1 0 14 16H2"/><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"/><path d="M9.8 4.4A2 2 0 1 1 11 8H2"/></Icon>;
        const Compass = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></Icon>;
        const Gauge = (props) => <Icon {...props}><path d="m12 14 4-4"/><path d="M3.34 16.66L2 18"/><path d="m22 18-1.34-1.34"/><path d="M22.7 10a10 10 0 1 0-15.39 10.14"/></Icon>;
        const CloudSun = (props) => <Icon {...props}><path d="M12 2v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="M20 12h2"/><path d="m19.07 4.93-1.41 1.41"/><path d="M15.947 12.65a4 4 0 0 0-5.925-4.128"/><path d="M3 20a5 5 0 1 1 8.9-4H13a3 3 0 0 1 2 5.24"/></Icon>;
        const CloudRain = (props) => <Icon {...props}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M16 14v6"/><path d="M8 14v6"/><path d="M12 16v6"/></Icon>;
        const CloudLightning = (props) => <Icon {...props}><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"/><path d="m13 11-4 6h6l-4 6"/></Icon>;
        const CloudSnow = (props) => <Icon {...props}><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M8 15h.01"/><path d="M8 19h.01"/><path d="M12 17h.01"/><path d="M12 21h.01"/><path d="M16 15h.01"/><path d="M16 19h.01"/></Icon>;
        const Sun = (props) => <Icon {...props}><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></Icon>;
        const Haze = (props) => <Icon {...props}><path d="M2 13h20"/><path d="M2 17h20"/><path d="M2 21h20"/><path d="M16 13a4 4 0 0 0-8 0"/><path d="m12 12-1.4-1.4"/></Icon>;

        const App = () => {
            // --- 모드 및 기본 정보 상태 ---
            const [mode, setMode] = useState('setup'); // 'setup' | 'broadcast'
            const [newsName, setNewsName] = useState('');
            const [anchorName, setAnchorName] = useState('');
            const [toastMsg, setToastMsg] = useState('');

            // --- 뉴스 큐시트 블록 상태 ---
            // 블록 타입: 'anchor' (최대 10개), 'reporter' (최대 10개), 'weather' (최대 1개)
            const [blocks, setBlocks] = useState([
                { id: 'init-1', type: 'anchor', headline: '' }
            ]);

            // 드래그 앤 드롭 상태
            const [draggedPaletteType, setDraggedPaletteType] = useState(null);
            const [draggedBlockIndex, setDraggedBlockIndex] = useState(null);
            const [dragOverIndex, setDragOverIndex] = useState(null);

            // --- 방송 진행 상태 ---
            const [sequenceIndex, setSequenceIndex] = useState(0);
            const [showOpeningTitle, setShowOpeningTitle] = useState(false);
            const [showReporterBadge, setShowReporterBadge] = useState(false);

            // --- 실시간 날씨 및 카메라/MediaPipe 상태 ---
            const [realtimeWeatherType, setRealtimeWeatherType] = useState('sunny');
            const [isMediaPipeLoaded, setIsMediaPipeLoaded] = useState(false);
            const [hasCameraPermission, setHasCameraPermission] = useState(false);
            const [isRequestingCam, setIsRequestingCam] = useState(false);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const animFrameRef = useRef(null);
            const isRunningRef = useRef(false);
            const selfieSegmentationRef = useRef(null);
            const isProcessingRef = useRef(false);
            const globalStreamRef = useRef(null);

            // 안내 메시지 토스트 표시 함수 (alert 대체)
            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => {
                    setToastMsg((prev) => (prev === msg ? '' : prev));
                }, 3200);
            };

            // 블록 개수 계산
            const anchorCount = blocks.filter(b => b.type === 'anchor').length;
            const reporterCount = blocks.filter(b => b.type === 'reporter').length;
            const weatherCount = blocks.filter(b => b.type === 'weather').length;

            // --- 1. 카메라 권한 요청 함수 (첫 페이지 버튼 및 자동 로드 지원) ---
            const requestCameraPermission = async (showSuccessToast = false) => {
                setIsRequestingCam(true);
                try {
                    if (globalStreamRef.current) {
                        setHasCameraPermission(true);
                        if (showSuccessToast) showToast('카메라가 이미 연결되어 있습니다!');
                        setIsRequestingCam(false);
                        return;
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 1280, height: 720 } 
                    });
                    globalStreamRef.current = stream;
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        videoRef.current.play().catch(() => {});
                    }
                    setHasCameraPermission(true);
                    if (showSuccessToast) showToast('카메라 권한이 허용되었습니다!');
                } catch (err) {
                    console.error("카메라 권한 오류:", err);
                    setHasCameraPermission(false);
                    if (showSuccessToast) showToast('카메라 권한이 거부되었습니다. 브라우저 주소창 옆 카메라 아이콘을 확인해주세요.');
                } finally {
                    setIsRequestingCam(false);
                }
            };

            useEffect(() => {
                // 페이지 열릴 때 자동으로 한 번 권한 확인 시도
                requestCameraPermission(false);
                return () => {
                    if (globalStreamRef.current) {
                        globalStreamRef.current.getTracks().forEach(track => track.stop());
                    }
                };
            }, []);

            // --- 2. 백그라운드 이미지/영상 프리로드 및 MediaPipe 초기화 ---
            useEffect(() => {
                // 이미지 프리로드 (방송 시작 시 딜레이 제로화)
                [ASSETS.anchorBg, ASSETS.titleBar, ASSETS.weatherBg].forEach(src => {
                    const img = new Image();
                    img.src = src;
                });

                const loadScript = (src) => {
                    return new Promise((resolve, reject) => {
                        if (document.querySelector(`script[src="${src}"]`)) {
                            resolve();
                            return;
                        }
                        const script = document.createElement('script');
                        script.src = src;
                        script.crossOrigin = 'anonymous';
                        script.onload = resolve;
                        script.onerror = reject;
                        document.body.appendChild(script);
                    });
                };

                const initMediaPipe = async () => {
                    try {
                        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js');
                        if (window.SelfieSegmentation) {
                            setIsMediaPipeLoaded(true);
                        }
                    } catch (error) {
                        console.error("MediaPipe 로드 오류:", error);
                    }
                };

                initMediaPipe();
                return () => {
                    isRunningRef.current = false;
                    if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                    if (selfieSegmentationRef.current) selfieSegmentationRef.current.close();
                };
            }, []);

            // --- 3. 실시간 날씨 데이터 연동 (첨부 파일의 [실시간] 로직 동일 적용) ---
            useEffect(() => {
                const fetchRealtimeWeather = async () => {
                    try {
                        const weatherRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.9780&current_weather=true');
                        const weatherData = await weatherRes.json();
                        const code = weatherData.current_weather.weathercode;
                        const temp = weatherData.current_weather.temperature;
                        const wind = weatherData.current_weather.windspeed;

                        let pm10 = 0;
                        try {
                            const airRes = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=37.5665&longitude=126.9780&current=pm10');
                            const airData = await airRes.json();
                            pm10 = airData.current.pm10;
                        } catch (e) { console.warn("미세먼지 정보 생략", e); }

                        let type = 'sunny';
                        if (code === 0) type = 'sunny';
                        else if (code >= 1 && code <= 3) type = 'cloudy';
                        else if ([45, 48].includes(code)) type = 'cloudy';
                        else if (code >= 51 && code <= 67) type = 'rainy';
                        else if (code >= 71 && code <= 86) type = 'snowy';
                        else if (code >= 95 && code <= 99) type = 'rainy';
                        
                        if (pm10 > 80) type = 'dust';
                        if (wind >= 36) type = 'windy';
                        if (temp >= 33) type = 'hot';
                        
                        setRealtimeWeatherType(type);
                    } catch (err) {
                        console.error('실시간 날씨 정보를 가져오는데 실패했습니다.', err);
                        setRealtimeWeatherType('sunny');
                    }
                };
                fetchRealtimeWeather();
            }, []);

            // 실시간 날짜 계산 (어제, 오늘, 내일)
            const getRealtimeDates = () => {
                const todayDate = new Date();
                const yesterday = new Date(todayDate);
                yesterday.setDate(todayDate.getDate() - 1);
                const tomorrow = new Date(todayDate);
                tomorrow.setDate(todayDate.getDate() + 1);

                return {
                    yesterdayStr: `어제 (${yesterday.getMonth() + 1}/${yesterday.getDate()})`,
                    todayStr: `오늘 (${todayDate.getMonth() + 1}/${todayDate.getDate()})`,
                    tomorrowStr: `내일 (${tomorrow.getMonth() + 1}/${tomorrow.getDate()})`
                };
            };

            const getRenderWeatherData = () => {
                const type = realtimeWeatherType;
                const weatherForecasts = {
                    sunny: {
                        yesterday: { icon: CloudSun, mainTemp: '26°C', subTemp: '10°C' },
                        today: { icon: Sun, mainTemp: '27°C', subTemp: '11°C', bg: 'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&q=80' },
                        tomorrow: { icon: Sun, mainTemp: '25°C', subTemp: '12°C' }
                    },
                    cloudy: {
                        yesterday: { icon: Sun, mainTemp: '28°C', subTemp: '19°C' },
                        today: { icon: CloudSun, mainTemp: '26°C', subTemp: '20°C', bg: 'https://images.unsplash.com/photo-1499956827185-0d63ee78a910?w=600&q=80' },
                        tomorrow: { icon: CloudRain, mainTemp: '24°C', subTemp: '18°C' }
                    },
                    rainy: {
                        yesterday: { icon: CloudSun, mainTemp: '29°C', subTemp: '21°C' },
                        today: { icon: CloudRain, mainTemp: '25°C', subTemp: '20°C', bg: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=600&q=80' },
                        tomorrow: { icon: CloudRain, mainTemp: '26°C', subTemp: '20°C' }
                    },
                    snowy: {
                        yesterday: { icon: CloudSun, mainTemp: '1°C', subTemp: '-7°C' },
                        today: { icon: CloudSnow, mainTemp: '-2°C', subTemp: '-10°C', bg: 'https://images.unsplash.com/photo-1542601098-3adb3baeb1ec?w=600&q=80' },
                        tomorrow: { icon: Sun, mainTemp: '0°C', subTemp: '-8°C' }
                    },
                    windy: {
                        yesterday: { icon: CloudSun, mainTemp: '14°C', subTemp: '5°C' },
                        today: { icon: Wind, mainTemp: '12°C', subTemp: '2°C', bg: 'https://images.unsplash.com/photo-1476820865390-c52aeebb9891?w=600&q=80' },
                        tomorrow: { icon: Sun, mainTemp: '15°C', subTemp: '4°C' }
                    },
                    dust: {
                        yesterday: { icon: Sun, mainTemp: '15°C', subTemp: '6°C' },
                        today: { icon: Haze, mainTemp: '16°C', subTemp: '5°C', bg: 'https://images.unsplash.com/photo-1545134969-8debd725b733?w=600&q=80' },
                        tomorrow: { icon: CloudSun, mainTemp: '17°C', subTemp: '7°C' }
                    },
                    hot: {
                        yesterday: { icon: Sun, mainTemp: '33°C', subTemp: '25°C' },
                        today: { icon: Sun, mainTemp: '35°C', subTemp: '26°C', bg: 'https://images.unsplash.com/photo-1504370805625-d32c54b16100?w=600&q=80' },
                        tomorrow: { icon: CloudLightning, mainTemp: '34°C', subTemp: '25°C' }
                    }
                };
                return weatherForecasts[type] || weatherForecasts.sunny;
            };

            // --- 4. MediaPipe 실시간 인물 누끼 합성 ---
            const onResults = (results) => {
                if (!canvasRef.current || !results || !results.image || !results.segmentationMask) return;
                const canvas = canvasRef.current;
                const canvasCtx = canvas.getContext('2d');
                
                if (results.image.width === 0 || results.image.height === 0) return;
                
                canvas.width = results.image.width;
                canvas.height = results.image.height;

                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                canvasCtx.globalCompositeOperation = 'copy';
                canvasCtx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);

                canvasCtx.globalCompositeOperation = 'source-in';
                canvasCtx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
                canvasCtx.restore();
            };

            const startCameraAndSegmentation = async () => {
                if (!isMediaPipeLoaded || !videoRef.current) return;
                const videoEl = videoRef.current;
                videoEl.width = 1280;
                videoEl.height = 720;

                try {
                    if (!globalStreamRef.current) {
                        globalStreamRef.current = await navigator.mediaDevices.getUserMedia({
                            video: { width: 1280, height: 720 }
                        });
                        setHasCameraPermission(true);
                    }
                    if (videoEl.srcObject !== globalStreamRef.current) {
                        videoEl.srcObject = globalStreamRef.current;
                    }
                    await videoEl.play().catch(() => {});
                } catch (err) {
                    console.error("비디오 스트림 재생 오류:", err);
                    return;
                }

                if (!selfieSegmentationRef.current) {
                    const SegClass = window.SelfieSegmentation;
                    selfieSegmentationRef.current = new SegClass({
                        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
                    });
                    selfieSegmentationRef.current.setOptions({ modelSelection: 1 });
                    selfieSegmentationRef.current.onResults(onResults);
                }

                isRunningRef.current = true;

                const processFrame = async () => {
                    if (!isRunningRef.current) return;
                    if (videoEl && videoEl.readyState >= 2 && selfieSegmentationRef.current && !isProcessingRef.current) {
                        isProcessingRef.current = true;
                        try {
                            await selfieSegmentationRef.current.send({ image: videoEl });
                        } catch (err) {
                            console.warn("MediaPipe Frame Error:", err);
                        } finally {
                            isProcessingRef.current = false;
                        }
                    }
                    if (isRunningRef.current) {
                        animFrameRef.current = requestAnimationFrame(processFrame);
                    }
                };

                if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
                animFrameRef.current = requestAnimationFrame(processFrame);
            };

            const stopCamera = () => {
                isRunningRef.current = false;
                if (animFrameRef.current) {
                    cancelAnimationFrame(animFrameRef.current);
                    animFrameRef.current = null;
                }
            };

            // 방송 모드가 켜지면 오프닝 영상이 나오는 동안 미리 카메라와 누끼 엔진을 가동해 버퍼링을 0으로 만듦
            useEffect(() => {
                if (mode === 'broadcast' && isMediaPipeLoaded) {
                    startCameraAndSegmentation();
                } else if (mode === 'setup') {
                    stopCamera();
                }
            }, [mode, isMediaPipeLoaded]);

            // --- 5. 블록 추가 / 수정 / 삭제 / 드래그 앤 드롭 핸들러 ---
            const createBlockObject = (type) => {
                const newId = 'block-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
                if (type === 'anchor') return { id: newId, type: 'anchor', headline: '' };
                if (type === 'reporter') return { id: newId, type: 'reporter', reporterName: '', bgUrl: '' };
                if (type === 'weather') return { id: newId, type: 'weather', weatherCasterName: '' };
                return null;
            };

            const canAddBlockType = (type) => {
                if (type === 'anchor' && anchorCount >= 10) {
                    showToast('앵커룸 블록은 최대 10개까지만 추가할 수 있습니다.');
                    return false;
                }
                if (type === 'reporter' && reporterCount >= 10) {
                    showToast('취재기자 블록은 최대 10개까지만 추가할 수 있습니다.');
                    return false;
                }
                if (type === 'weather' && weatherCount >= 1) {
                    showToast('날씨 예보 블록은 한 번만 넣을 수 있습니다.');
                    return false;
                }
                return true;
            };

            const handleAddBlock = (type, insertAtIndex = null) => {
                if (!canAddBlockType(type)) return;
                const newBlock = createBlockObject(type);
                if (!newBlock) return;

                if (insertAtIndex !== null && insertAtIndex >= 0 && insertAtIndex <= blocks.length) {
                    const updated = [...blocks];
                    updated.splice(insertAtIndex, 0, newBlock);
                    setBlocks(updated);
                } else {
                    setBlocks([...blocks, newBlock]);
                }
            };

            const handleRemoveBlock = (id) => {
                setBlocks(blocks.filter(b => b.id !== id));
            };

            const handleMoveBlock = (index, direction) => {
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= blocks.length) return;
                const updated = [...blocks];
                const [moved] = updated.splice(index, 1);
                updated.splice(targetIndex, 0, moved);
                setBlocks(updated);
            };

            const handleUpdateBlock = (id, field, value) => {
                setBlocks(prevBlocks => prevBlocks.map(b => {
                    if (b.id !== id) return b;
                    if (field === 'headline' && value.length > MAX_HEADLINE_LENGTH) {
                        value = value.slice(0, MAX_HEADLINE_LENGTH);
                    }
                    return { ...b, [field]: value };
                }));
            };

            const handleReporterBgUpload = (id, file) => {
                if (!file) return;
                const objectUrl = URL.createObjectURL(file);
                // 업로드 즉시 프리로드하여 방송 중 깜빡임 방지
                const img = new Image();
                img.src = objectUrl;
                // bgUrl과 fileName을 한 번에 업데이트하여 상태 덮어쓰기 방지
                setBlocks(prevBlocks => prevBlocks.map(b => {
                    if (b.id !== id) return b;
                    return { ...b, bgUrl: objectUrl, fileName: file.name };
                }));
            };

            // 드래그 앤 드롭 이벤트
            const onPaletteDragStart = (e, type) => {
                setDraggedPaletteType(type);
                setDraggedBlockIndex(null);
                e.dataTransfer.effectAllowed = 'copy';
            };

            const onTimelineDragStart = (e, index) => {
                setDraggedBlockIndex(index);
                setDraggedPaletteType(null);
                e.dataTransfer.effectAllowed = 'move';
            };

            const onTimelineDragOver = (e, index) => {
                e.preventDefault();
                setDragOverIndex(index);
            };

            const onTimelineDrop = (e, dropIndex) => {
                e.preventDefault();
                setDragOverIndex(null);

                if (draggedPaletteType) {
                    handleAddBlock(draggedPaletteType, dropIndex);
                    setDraggedPaletteType(null);
                } else if (draggedBlockIndex !== null && draggedBlockIndex !== dropIndex) {
                    const updated = [...blocks];
                    const [moved] = updated.splice(draggedBlockIndex, 1);
                    const targetIdx = dropIndex > draggedBlockIndex ? dropIndex - 1 : dropIndex;
                    updated.splice(targetIdx, 0, moved);
                    setBlocks(updated);
                    setDraggedBlockIndex(null);
                }
            };

            const onContainerDrop = (e) => {
                e.preventDefault();
                setDragOverIndex(null);
                if (draggedPaletteType) {
                    handleAddBlock(draggedPaletteType);
                    setDraggedPaletteType(null);
                }
            };

            // --- 6. 전체 방송 큐시트 시퀀스 생성 ---
            // [고정 1: 오프닝 영상] -> [고정 2: 오프닝 멘트] -> [선택 블록들] -> [고정 마지막: 클로징 멘트]
            const broadcastSequence = [
                { stepType: 'opening_video' },
                { stepType: 'opening_ment' },
                ...blocks.map(b => ({ stepType: b.type, ...b })),
                { stepType: 'closing_ment' }
            ];

            const currentSlide = broadcastSequence[sequenceIndex] || broadcastSequence[0];

            // --- 7. 방송 시작 및 단계 전환 제어 ---
            const handleStartBroadcast = () => {
                if (!hasCameraPermission) {
                    showToast('먼저 상단의 [카메라 권한 허용하기] 버튼을 눌러 카메라를 켜주세요.');
                    return;
                }
                if (!newsName.trim()) {
                    showToast('뉴스 이름을 입력해주세요!');
                    return;
                }
                if (!anchorName.trim()) {
                    showToast('앵커 이름을 입력해주세요!');
                    return;
                }
                if (blocks.length === 0) {
                    showToast('최소 1개 이상의 뉴스 구성 블록(앵커룸/취재기자/날씨)을 추가해주세요!');
                    return;
                }

                // 각 블록 필수 입력 확인
                for (let i = 0; i < blocks.length; i++) {
                    const b = blocks[i];
                    if (b.type === 'anchor' && !b.headline.trim()) {
                        showToast(`${i + 1}번째 블록(앵커룸)의 기사 제목을 입력해주세요.`);
                        return;
                    }
                    if (b.type === 'reporter' && !b.reporterName.trim()) {
                        showToast(`${i + 1}번째 블록(취재기자)의 기자 이름을 입력해주세요.`);
                        return;
                    }
                    if (b.type === 'reporter' && !b.bgUrl) {
                        showToast(`${i + 1}번째 블록(취재기자)의 현장 배경 사진을 업로드해주세요.`);
                        return;
                    }
                    if (b.type === 'weather' && !b.weatherCasterName?.trim()) {
                        showToast(`${i + 1}번째 블록(날씨 예보)의 기상캐스터 이름을 입력해주세요.`);
                        return;
                    }
                }

                try {
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen().catch(() => {});
                    }
                } catch (e) {}

                setSequenceIndex(0);
                setMode('broadcast');
            };

            const handleNextStep = () => {
                if (sequenceIndex < broadcastSequence.length - 1) {
                    setSequenceIndex(prev => prev + 1);
                } else {
                    // 클로징 멘트 이후 첫 페이지로 복귀
                    if (document.fullscreenElement) {
                        document.exitFullscreen().catch(() => {});
                    }
                    setMode('setup');
                    setSequenceIndex(0);
                }
            };

            const handlePrevStep = () => {
                if (sequenceIndex > 0) {
                    setSequenceIndex(prev => prev - 1);
                }
            };

            // 키보드 방향키(우측 화살표, 스페이스바)로도 다음 장면 전환 가능
            useEffect(() => {
                if (mode !== 'broadcast') return;
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        e.preventDefault();
                        handleNextStep();
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        handlePrevStep();
                    } else if (e.key === 'Escape') {
                        setMode('setup');
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [mode, sequenceIndex, broadcastSequence.length]);

            // 오프닝 영상: 시작 3초 후 뉴스명 등장
            useEffect(() => {
                let timer;
                if (mode === 'broadcast' && currentSlide.stepType === 'opening_video') {
                    setShowOpeningTitle(false);
                    timer = setTimeout(() => setShowOpeningTitle(true), 3000);
                } else {
                    setShowOpeningTitle(false);
                }
                return () => clearTimeout(timer);
            }, [mode, sequenceIndex, currentSlide.stepType]);

            // 취재기자 페이지: 진입 후 초반 5초 동안만 기자 이름 표시
            useEffect(() => {
                let timer;
                if (mode === 'broadcast' && currentSlide.stepType === 'reporter') {
                    setShowReporterBadge(true);
                    timer = setTimeout(() => {
                        setShowReporterBadge(false);
                    }, 5000);
                } else {
                    setShowReporterBadge(false);
                }
                return () => clearTimeout(timer);
            }, [mode, sequenceIndex, currentSlide.id, currentSlide.stepType]);

            const dates = getRealtimeDates();
            const renderData = getRenderWeatherData();

            return (
                <div className="w-full min-h-screen font-sans relative">
                    {/* 숨겨진 원본 카메라 비디오 태그 */}

                                        <button

                                        >

                                            ) : (

                                        </button>

                                        <div className={`px-4 py-3.5 rounded-2xl font-bold text-sm flex items-center gap-2 border-2 ${
                                            isMediaPipeLoaded 
                                                ? 'bg-blue-50 text-blue-700 border-blue-300'

                                            <span>{isMediaPipeLoaded ? 'AI 누끼 합성 준비 완료' : 'AI 합성 엔진 로딩 중...'}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* 기본 방송 정보 입력 (뉴스 명, 앵커 이름) */}
                                <div className="bg-white rounded-3xl p-6 md:p-8 shadow-xl border-2 border-blue-100 mb-6">
                                    <h2 className="text-xl font-black text-blue-900 mb-4 flex items-center gap-2">
                                        <span className="bg-blue-600 text-white w-7 h-7 rounded-full inline-flex items-center justify-center text-sm">1</span>

                                                >

                                                >

                                                >

                                    {/* 기상캐스터 이름 배지 (왼쪽 하단 표시) */}
                                    <div className="absolute bottom-12 left-12 bg-sky-900/90 text-white px-8 py-4 rounded-2xl border-l-8 border-yellow-400 z-40 shadow-2xl backdrop-blur-md flex items-center gap-4">
                                        <span className="bg-yellow-400 text-slate-900 text-sm font-black px-3 py-1 rounded-lg">기상캐스터</span>
                                        <p className="text-[35px] leading-tight font-black">{currentSlide.weatherCasterName}</p>
                                    </div>
                                </>
                            )}

                            {/* 클로징 멘트 (고정 마지막 순서 - 이름 자막 표시 안 함) */}

                            {/* --------------------------------------------------
                                (E) 방송 제어 네비게이션 버튼 (이전 / 다음)
                               -------------------------------------------------- */}
                            {currentSlide.stepType !== 'opening_video' && (
                                <>
                                    {/* 이전 단계 버튼 (좌측 중앙, 마우스 호버 시 선명해짐) */}
                                    {sequenceIndex > 1 && (
                                        <button 
                                            onClick={handlePrevStep} 
                                            className="absolute top-1/2 left-6 transform -translate-y-1/2 bg-white/10 hover:bg-white/35 p-4 rounded-full backdrop-blur-md z-50 transition opacity-40 hover:opacity-100 cursor-pointer"
                                            title="이전 장면"
                                        >
                                            <ChevronLeft size={40} color="white" />
                                        </button>
                                    )}

                                    {/* 다음 단계 버튼 (우측 중앙) */}
                                    <button 
                                        onClick={handleNextStep} 
                                        className="absolute top-1/2 right-6 transform -translate-y-1/2 bg-white/20 hover:bg-white/40 p-5 rounded-full backdrop-blur-md z-50 transition cursor-pointer shadow-lg"
                                        title={sequenceIndex === broadcastSequence.length - 1 ? "방송 종료 (첫 화면으로)" : "다음 장면"}
                                    >
                                        <ChevronRight size={50} color="white" />
                                    </button>

                                    {/* 좌측 상단 현재 진행 표시기 (마우스를 올리면 보임) */}
                                    <div className="absolute top-4 left-4 z-50 opacity-20 hover:opacity-100 transition flex items-center gap-2 bg-black/50 text-white px-4 py-2 rounded-full text-xs font-bold backdrop-blur-sm">
                                        <span>진행 순서: {sequenceIndex} / {broadcastSequence.length - 1}</span>
                                        <span>|</span>
                                        <button 
                                            onClick={() => {
                                                if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
                                                setMode('setup');
                                            }}
                                            className="text-red-300 hover:text-red-100 underline ml-1"
                                        >
                                            편집 화면으로 나가기
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
